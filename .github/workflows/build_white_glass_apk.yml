name: Build v2rayNG White Glass APK

# 与官方 2dust/v2rayNG/.github/workflows/build.yml 对齐的关键点：
#   1. 必须拉子模块（AndroidLibXrayLite / hev-socks5-tunnel），否则编不出可用包
#   2. 必须装 Android SDK 37 + NDK 30，项目 compileSdk=37
#   3. 必须用 JDK 21
#   4. 产物路径带 flavor：apk/fdroid/debug/ 而不是 apk/debug/
# 本工作流只产 debug 签名包，无需配置 secrets。

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

concurrency:
  group: white-glass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

      - name: Inject ndkVersion into build.gradle.kts
        run: |
          sed -i 's|^    compileSdk = 37$|    compileSdk = 37\n    ndkVersion = "30.0.16248370"|' \
            V2rayNG/app/build.gradle.kts
          grep -n 'ndkVersion' V2rayNG/app/build.gradle.kts

      - name: Build libhevtun (native)
        run: bash compile-hevtun.sh

      - name: Copy libhevtun into app module
        run: cp -r libs V2rayNG/app

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "Current tag in submodule: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build F-Droid Debug APK
        working-directory: ./V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon --stacktrace

      - name: Show produced APKs
        if: always()
        run: |
          find V2rayNG/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload White Glass APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-WhiteGlass-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
